minimum_pre_commit_version: '2.17'
default_install_hook_types: [pre-commit, commit-msg]
repos:
  # base hooks
  #
  # helm/<chart>/charts/ holds vendored upstream subcharts (vendir-synced).
  # Those files are not repo-authored: the auto-fixing hooks would rewrite
  # them on every vendir bump and the next vendir sync would revert the fix,
  # so the whitespace/shebang hooks skip the vendored subtree.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
        exclude: "^helm/[^/]+/charts/.*"
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: "(.*testdata/.*|^\\.yarn/.*|^helm/[^/]+/charts/.*)"
      - id: mixed-line-ending
        exclude: "^helm/[^/]+/charts/.*"
      - id: trailing-whitespace
        exclude: "(.*testdata/.*|^\\.yarn/.*|^helm/[^/]+/charts/.*)"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

  # Go hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy
      - id: golangci-lint
        args:
          - -E=gosec
          - -E=goconst
          - -E=govet
          # timeout is needed for CI
          - --timeout=300s
          # List all issues found
          - --max-same-issues=0
          - --max-issues-per-linter=0
      - id: go-imports
        args: [ -local, github.com/giantswarm/mcp-debug ]
